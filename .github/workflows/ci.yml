# CI

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web build
        working-directory: web
        run: |
          npm install
          npm run build
