# CI

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests + coverage (100%)
        run: pytest -q --cov=sprucer --cov-report=term-missing --cov-fail-under=100
      - name: Ruff
        run: ruff check src tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web build
        working-directory: web
        run: |
          npm install
          npm run build

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        run: semgrep scan --config p/python --config p/owasp-top-ten --error --metrics=off
