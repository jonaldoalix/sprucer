services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sprucer
      POSTGRES_PASSWORD: sprucer
      POSTGRES_DB: sprucer
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprucer -d sprucer"]
      interval: 3s
      timeout: 3s
      retries: 20
    profiles: ["postgres"]

  brain:
    build:
      context: .
      dockerfile: Dockerfile.brain
    ports:
      - "8787:8787"
    environment:
      SPRUCER_HOST: "0.0.0.0"
      SPRUCER_PORT: "8787"
      SPRUCER_DATABASE_URL: "${SPRUCER_DATABASE_URL:-sqlite:////data/sprucer.db}"
      SPRUCER_AUTH_MODE: "${SPRUCER_AUTH_MODE:-dev}"
      SPRUCER_DEV_PASSWORD: "${SPRUCER_DEV_PASSWORD:-sprucer-dev}"
      SPRUCER_LLM_URL: "${SPRUCER_LLM_URL:-http://host.docker.internal:4000/v1}"
      SPRUCER_LLM_API_KEY: "${SPRUCER_LLM_API_KEY:-sk-change-me}"
      SPRUCER_LLM_MODEL: "${SPRUCER_LLM_MODEL:-qwen-coder}"
      SPRUCER_OIDC_ISSUER: "${SPRUCER_OIDC_ISSUER:-}"
      SPRUCER_OIDC_CLIENT_ID: "${SPRUCER_OIDC_CLIENT_ID:-}"
      SPRUCER_OIDC_CLIENT_SECRET: "${SPRUCER_OIDC_CLIENT_SECRET:-}"
      SPRUCER_OIDC_REDIRECT_URI: "${SPRUCER_OIDC_REDIRECT_URI:-http://localhost:3737/v1/auth/oidc/callback}"
    volumes:
      - sprucer-data:/data
    profiles: ["app"]

  brain-postgres:
    build:
      context: .
      dockerfile: Dockerfile.brain
    ports:
      - "8788:8787"
    environment:
      SPRUCER_HOST: "0.0.0.0"
      SPRUCER_PORT: "8787"
      SPRUCER_DATABASE_URL: "postgresql+psycopg://sprucer:sprucer@db:5432/sprucer"
      SPRUCER_AUTH_MODE: "dev"
      SPRUCER_DEV_PASSWORD: "sprucer-dev"
      SPRUCER_LLM_URL: "${SPRUCER_LLM_URL:-http://host.docker.internal:4000/v1}"
      SPRUCER_LLM_API_KEY: "${SPRUCER_LLM_API_KEY:-sk-local-mock}"
      SPRUCER_LLM_MODEL: "${SPRUCER_LLM_MODEL:-mock-sprucer}"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["postgres"]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3737:3737"
    environment:
      SPRUCER_PUBLIC_URL: "http://brain:8787"
      NEXT_PUBLIC_SPRUCER_API_URL: "http://127.0.0.1:8787"
    depends_on:
      - brain
    profiles: ["app"]

volumes:
  sprucer-data:
