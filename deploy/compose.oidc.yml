# Production-shaped stack: OIDC login + Postgres + web.
#
# Before starting:
#   1. Copy deploy/env.oidc.example → .env.oidc and fill real secrets
#   2. Register a confidential OIDC client at your IdP (Authentik, Auth0, Keycloak, …)
#      Redirect URI must match SPRUCER_OIDC_REDIRECT_URI exactly
#   3. Point SPRUCER_LLM_* at a reachable OpenAI-compatible endpoint
#
#   docker compose -f deploy/compose.oidc.yml --env-file .env.oidc up --build
#
# Notes:
# - auth_mode=oidc (no shared password)
# - SPRUCER_COOKIE_SECURE=1 assumes HTTPS in front (Caddy/Traefik/cloud LB)
# - /docs disabled by default
# - Still single-tenant: every OIDC subject shares one vault (by design today)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sprucer
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: sprucer
    volumes:
      - sprucer-oidc-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprucer -d sprucer"]
      interval: 5s
      timeout: 5s
      retries: 20

  brain:
    build:
      context: ..
      dockerfile: Dockerfile.brain
    environment:
      SPRUCER_HOST: "0.0.0.0"
      SPRUCER_DATABASE_URL: "postgresql+psycopg://sprucer:${POSTGRES_PASSWORD}@db:5432/sprucer"
      SPRUCER_AUTH_MODE: "oidc"
      SPRUCER_SESSION_SECRET: "${SPRUCER_SESSION_SECRET}"
      SPRUCER_COOKIE_SECURE: "${SPRUCER_COOKIE_SECURE:-1}"
      SPRUCER_DOCS_ENABLED: "${SPRUCER_DOCS_ENABLED:-0}"
      SPRUCER_CORS_ORIGINS: "${SPRUCER_CORS_ORIGINS}"
      SPRUCER_OIDC_ISSUER: "${SPRUCER_OIDC_ISSUER}"
      SPRUCER_OIDC_CLIENT_ID: "${SPRUCER_OIDC_CLIENT_ID}"
      SPRUCER_OIDC_CLIENT_SECRET: "${SPRUCER_OIDC_CLIENT_SECRET}"
      SPRUCER_OIDC_REDIRECT_URI: "${SPRUCER_OIDC_REDIRECT_URI}"
      SPRUCER_OIDC_POST_LOGIN_REDIRECT: "${SPRUCER_OIDC_POST_LOGIN_REDIRECT}"
      # Optional machine keys for CLI/agents alongside OIDC sessions
      SPRUCER_API_KEYS: "${SPRUCER_API_KEYS:-}"
      SPRUCER_LLM_URL: "${SPRUCER_LLM_URL}"
      SPRUCER_LLM_API_KEY: "${SPRUCER_LLM_API_KEY}"
      SPRUCER_LLM_MODEL: "${SPRUCER_LLM_MODEL}"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    environment:
      SPRUCER_PUBLIC_URL: "http://brain:8787"
      NEXT_PUBLIC_SPRUCER_API_URL: "${PUBLIC_WEB_ORIGIN}"
    depends_on:
      - brain
    # Publish ports only if you are not putting Traefik/Caddy in front.
    ports:
      - "${WEB_HOST_PORT:-3737}:3737"

volumes:
  sprucer-oidc-pg:
