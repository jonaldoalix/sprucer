[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sprucer"
version = "0.1.0"
description = "Truth-first career desk: knowledge bank, JD ingest, grounded generate, application tracker"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Full Stack Boston contributors" }]
keywords = ["career", "resume", "cover-letter", "job-search", "openai-compatible"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.32",
  "psycopg[binary]>=3.2.0",
  "python-multipart>=0.0.9",
  "typer>=0.12.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
sprucer-brain = "sprucer.api.app:run"
sprucer = "sprucer.cli.main:app"

[tool.hatch.build.targets.sdist]
include = ["src/sprucer", "fixtures", "docs", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["sprucer"]
omit = [
  "*/sprucer/cli/main.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep CI signal high; expand selectively rather than blocking on style debt.
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F821", "F822", "F823"]
